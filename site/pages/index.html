<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The identity page of c0nn3ct.info: small, finished software that stays on your side of the wire."
    />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>c0nn3ct.info: small, finished software on your side of the wire</title>
    <script>
      (function () {
        try {
          // The prerender snapshots whatever theme class the capturing browser
          // ran with; drop it before applying this visitor's preference.
          var c = document.documentElement.classList;
          c.remove('dark', 'light');
          c.add(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/entries/home.tsx"></script>
  </body>
</html>
